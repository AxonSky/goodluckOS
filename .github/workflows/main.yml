name: Build Full Custom goodluckOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with all branches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge all feature branches
        run: |
          git config user.name "Builder"
          git config user.email "builder@local"
          git fetch --all
          for branch in $(git branch -r | grep -v '\->' | grep -v 'origin/main' | sed 's/origin\///'); do
            echo "Merging $branch..."
            git merge -X theirs --no-edit origin/$branch || git merge --abort
          done

      - name: Build Home Overlay
        run: |
          cd home
          chmod +x build.sh
          ./build.sh

      - name: Build Rootfs
        run: |
          cd rootfs
          chmod +x start.sh scripts/*.sh
          mkdir -p out output
          docker build -t goodluck-rootfs .
          MOUNTS=""
          for item in *; do
            if [ "$item" != "buildroot" ] && [ "$item" != "Dockerfile" ]; then
              MOUNTS="$MOUNTS -v $(pwd)/$item:/src/$item"
            fi
          done
          docker run --rm $MOUNTS goodluck-rootfs bash -c "./scripts/configure.sh && ./scripts/build.sh"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goodluckOS-full-custom
          path: |
            rootfs/output/rootfs.tar
            rootfs/out/images/rootfs.tar
            home/out/home.tar
